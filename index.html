<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="形色场 UI Handbook——一份从设计令牌到高级交互的完整 UI 组件教程：每个组件包含可交互预览、用途说明、实现要点、无障碍细节与核心代码，React + Tailwind CSS 手写实现。" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318181b'/%3E%3Crect x='7' y='7' width='8' height='8' rx='1.5' fill='%23ffffff'/%3E%3Crect x='17' y='7' width='8' height='8' rx='1.5' fill='%23ffffff' opacity='.4'/%3E%3Crect x='7' y='17' width='8' height='8' rx='1.5' fill='%23ffffff' opacity='.4'/%3E%3Crect x='17' y='17' width='8' height='8' rx='1.5' fill='%23ffffff'/%3E%3C/svg%3E" />
    <title>形色场 UI Handbook · 从设计令牌到高级交互的完整组件教程</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var d = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (d) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
